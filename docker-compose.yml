services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: local-ai-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_NAME: "Local AI R&D"
    volumes:
      - "./open-webui/data:/app/backend/data"
    networks:
      - local-ai-network

  postgres:
    image: pgvector/pgvector:pg17
    container_name: local-ai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: local_ai
      POSTGRES_USER: local_ai
      POSTGRES_PASSWORD: change_this_password
    volumes:
      - "./postgres/data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_ai -d local_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - local-ai-network

  nodered:
    image: nodered/node-red:latest
    container_name: local-ai-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: "Asia/Bangkok"
      OLLAMA_URL: "http://host.docker.internal:11434"
    volumes:
      - "./nodered/data:/data"
      - "./documents:/documents"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - local-ai-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: local-ai-pgadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: change_this_pgadmin_password
    volumes:
      - "./pgadmin/data:/var/lib/pgadmin"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - local-ai-network
  portainer:
    image: portainer/portainer-ce:latest
    container_name: local-ai-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./portainer/data:/data"
    networks:
      - local-ai-network
networks:
  local-ai-network:
    name: local-ai-network
    driver: bridge
